apply plugin: 'com.android.application'

base {
    archivesName = "RacePulsePH"
}

android {
    namespace = "com.racepulseph.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.racepulseph.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storePath = System.getenv('KEYSTORE_PATH') ?: (project.hasProperty('RELEASE_STORE_FILE') ? project.property('RELEASE_STORE_FILE') : null)
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: (project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD') : '')
                keyAlias System.getenv('KEYSTORE_ALIAS') ?: (project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS') : '')
                keyPassword System.getenv('KEYSTORE_ALIAS_PASSWORD') ?: (project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD') : '')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                outputFileName = "RacePulsePH.apk"
            }
        }
    }
}

afterEvaluate {
    tasks.matching { it.name == 'signReleaseBundle' || it.name == 'bundleRelease' }.configureEach { bundleTask ->
        bundleTask.doLast {
            def bundleDir = layout.buildDirectory.dir("outputs/bundle/release").get().asFile
            def target = new File(bundleDir, "RacePulsePH.aab")
            def candidates = (bundleDir.listFiles()?.findAll { it.name.endsWith(".aab") && it.name != "RacePulsePH.aab" } ?: [])
                .sort { a, b ->
                    def aPreferred = a.name == "RacePulsePH-release.aab" ? 0 : 1
                    def bPreferred = b.name == "RacePulsePH-release.aab" ? 0 : 1
                    aPreferred != bPreferred ? (aPreferred <=> bPreferred) : (b.lastModified() <=> a.lastModified())
                }
            if (!candidates.isEmpty()) {
                java.nio.file.Files.copy(
                    candidates[0].toPath(),
                    target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
