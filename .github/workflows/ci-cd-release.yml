name: RacePulsePH CI/CD Release

on:
  push:
    branches:
      - main
      - QA
  pull_request:
    branches:
      - main
      - QA
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed Android APK and AAB to GitHub Releases
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-cd-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Security, secret scan, and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Run repository secret, password, and hardening audit
        run: npm run security:check

      - name: Scan Git history and workspace with Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$ARCHIVE"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact --verbose --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --no-banner --redact --verbose --config .gitleaks.toml .

      - name: Install root and Functions dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Audit production dependencies
        run: npm run security:audit

  rules-security:
    name: Test Firestore and Storage security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json', 'firestore.rules', 'storage.rules') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install root and Functions dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Run Firestore and Storage security rules emulator tests
        run: |
          npx --yes firebase-tools emulators:exec \
            --only firestore,storage \
            --project demo-racepulse-rbac \
            "node --test tests/access-rules.test.cjs tests/access-service.test.cjs tests/storage-access.test.cjs"

  verify:
    name: Verify rules, version parity, lint, tests, and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated Firestore and RBAC rules are up to date
        run: |
          npm run generate:access
          git diff --exit-code firestore.rules src/lib/access-presets.json functions/

      - name: Verify SemVer and Android version parity
        run: npm run version:check

      - name: Validate skill library
        run: node .agents/skills/racepulse-skill-maker/scripts/validate-skill-library.cjs

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build web app and LAN server
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Inspect built distribution for leaked secrets or server files
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: node scripts/security-audit.cjs --dist

      - name: Run unit and security tests
        run: |
          node --test \
            tests/access-policy.test.cjs \
            tests/lan-access.test.cjs \
            tests/account-client.test.cjs \
            tests/account-security.test.cjs \
            tests/timing-sequence.test.cjs \
            tests/lan-http.test.cjs \
            tests/security-client.test.cjs \
            tests/security-audit.test.cjs \
            tests/release-version.test.cjs
          npx tsx --test tests/highlights.test.ts tests/access-draft.test.ts

      - name: Verify Cloud Functions JavaScript syntax
        run: |
          for file in functions/*.js; do
            node --check "$file"
          done

      - name: Upload web distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: racepulseph-web-dist
          path: |
            dist/
          if-no-files-found: error

  android-release:
    name: Build signed RacePulsePH APK/AAB and publish GitHub Release
    needs: [security, rules-security, verify]
    permissions:
      contents: write
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release signing secrets exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${ANDROID_KEYSTORE_ALIAS:-}" ] && missing="$missing ANDROID_KEYSTORE_ALIAS"
          [ -z "${ANDROID_KEY_PASSWORD:-}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secret(s):$missing. Add them in Repository Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Decode signing keystore and Firebase Android config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/racepulseph-release.jks"
          chmod 600 "$RUNNER_TEMP/racepulseph-release.jks"
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret is unset; building without android/app/google-services.json."
          fi

      - name: Build and verify signed RacePulsePH.apk and RacePulsePH.aab
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/racepulseph-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          npm run release:android -- --require-signed

      - name: Audit packaged Android APK/AAB contents and checksums
        run: |
          set -euo pipefail
          (cd release/android && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import re, zipfile, sys
          forbidden = re.compile(r'(?:^|/)(?:server\.cjs(?:\.map)?|\.env.*|\.secret.*|keystore\.txt)$|\.(?:jks|keystore|p12|pfx|pem|key)$', re.I)
          for pkg in ('release/android/RacePulsePH.apk', 'release/android/RacePulsePH.aab'):
              with zipfile.ZipFile(pkg) as zf:
                  bad = [name for name in zf.namelist() if forbidden.search(name)]
                  if bad:
                      print(f'ERROR: Forbidden file(s) packaged in {pkg}: {bad}', file=sys.stderr)
                      sys.exit(1)
          print('PASS: Android APK and AAB contain zero server bundles, keystores, or secret files.')
          PY

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: racepulseph-android-release
          path: |
            release/android/RacePulsePH.apk
            release/android/RacePulsePH.aab
            release/android/RacePulsePH.apk.sha256
            release/android/RacePulsePH.aab.sha256
            release/android/SHA256SUMS.txt
          if-no-files-found: error

      - name: Compute release tag and metadata
        id: meta
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          VERSION_CODE=$(node -e "const d=JSON.parse(require('child_process').execSync('node scripts/release-version.cjs --json',{encoding:'utf8'})); process.stdout.write(String(d.versionCode))")
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="v${VERSION}"
            PRERELEASE="false"
            TITLE="RacePulsePH v${VERSION}"
          else
            TAG="v${VERSION}-qa.${VERSION_CODE}"
            PRERELEASE="true"
            TITLE="RacePulsePH v${VERSION} (QA Build ${VERSION_CODE})"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with RacePulsePH binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ASSETS=(
            "release/android/RacePulsePH.apk"
            "release/android/RacePulsePH.aab"
            "release/android/RacePulsePH.apk.sha256"
            "release/android/RacePulsePH.aab.sha256"
            "release/android/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" "${ASSETS[@]}" \
                --target "$TARGET_SHA" \
                --title "$TITLE" \
                --prerelease \
                --generate-notes
            else
              gh release create "$TAG" "${ASSETS[@]}" \
                --target "$TARGET_SHA" \
                --title "$TITLE" \
                --latest \
                --generate-notes
            fi
          fi

      - name: Clean temporary secret files
        if: always()
        run: |
          for f in "$RUNNER_TEMP/racepulseph-release.jks" android/app/google-services.json; do
            if [ -f "$f" ]; then
              shred -u "$f" 2>/dev/null || rm -f "$f"
            fi
          done
