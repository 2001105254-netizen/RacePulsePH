name: RacePulsePH CI/CD Release

on:
  push:
    branches:
      - main
      - QA
  pull_request:
    branches:
      - main
      - QA
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed Android APK and AAB to GitHub Releases
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ci-cd-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify rules, version parity, lint, tests, and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated Firestore and RBAC rules are up to date
        run: |
          npm run generate:access
          git diff --exit-code firestore.rules functions/

      - name: Verify SemVer and Android version parity
        run: npm run version:check

      - name: Validate skill library
        run: node .agents/skills/racepulse-skill-maker/scripts/validate-skill-library.cjs

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build web app and LAN server
        run: npm run build

      - name: Run unit tests
        run: |
          node --test \
            tests/access-policy.test.cjs \
            tests/lan-access.test.cjs \
            tests/account-client.test.cjs \
            tests/account-security.test.cjs \
            tests/timing-sequence.test.cjs \
            tests/lan-http.test.cjs \
            tests/release-version.test.cjs

      - name: Upload web distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: racepulseph-web-dist
          path: |
            dist/
          if-no-files-found: error

  android-release:
    name: Build signed RacePulsePH APK/AAB and publish GitHub Release
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release signing secrets exist
        run: |
          missing=""
          [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${ANDROID_KEYSTORE_ALIAS:-}" ] && missing="$missing ANDROID_KEYSTORE_ALIAS"
          [ -z "${ANDROID_KEY_PASSWORD:-}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secret(s):$missing. Add them in Repository Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Decode signing keystore and Firebase Android config
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/racepulseph-release.jks"
          chmod 600 "$RUNNER_TEMP/racepulseph-release.jks"
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret is unset; building without android/app/google-services.json."
          fi
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/racepulseph-release.jks"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEYSTORE_ALIAS=$ANDROID_KEYSTORE_ALIAS"
            echo "KEYSTORE_ALIAS_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build and verify signed RacePulsePH.apk and RacePulsePH.aab
        run: |
          chmod +x android/gradlew
          npm run release:android -- --require-signed

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: racepulseph-android-release
          path: |
            release/android/RacePulsePH.apk
            release/android/RacePulsePH.aab
            release/android/RacePulsePH.apk.sha256
            release/android/RacePulsePH.aab.sha256
            release/android/SHA256SUMS.txt
          if-no-files-found: error

      - name: Compute release tag and metadata
        id: meta
        run: |
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          VERSION_CODE=$(node -e "const d=JSON.parse(require('child_process').execSync('node scripts/release-version.cjs --json',{encoding:'utf8'})); process.stdout.write(String(d.versionCode))")
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG="v${VERSION}"
            PRERELEASE="false"
            TITLE="RacePulsePH v${VERSION}"
          else
            TAG="v${VERSION}-qa.${VERSION_CODE}"
            PRERELEASE="true"
            TITLE="RacePulsePH v${VERSION} (QA Build ${VERSION_CODE})"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with RacePulsePH binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          ASSETS=(
            "release/android/RacePulsePH.apk"
            "release/android/RacePulsePH.aab"
            "release/android/RacePulsePH.apk.sha256"
            "release/android/RacePulsePH.aab.sha256"
            "release/android/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" "${ASSETS[@]}" \
                --target "${{ github.sha }}" \
                --title "$TITLE" \
                --prerelease \
                --generate-notes
            else
              gh release create "$TAG" "${ASSETS[@]}" \
                --target "${{ github.sha }}" \
                --title "$TITLE" \
                --latest \
                --generate-notes
            fi
          fi

      - name: Clean temporary secret files
        if: always()
        run: rm -f "$RUNNER_TEMP/racepulseph-release.jks" android/app/google-services.json

